---
layout: default
---

<div class="wrap page">
  <h1>{{ page.title }}</h1>
  <p class="meta page-meta">
    {% if page.github_url %}<a href="{{ page.github_url }}" target="_blank" rel="noopener">GitHub ↗</a>{% endif %}
    {% if page.external_url %}· <a href="{{ page.external_url }}" target="_blank" rel="noopener">try it ↗</a>{% endif %}
  </p>
  {{ content }}
</div>
