title: "Scott Mather"
description: "Oakland-based website administrator & developer."
url: "https://csmather.com"   # custom domain, bound via the CNAME file
baseurl: ""                   # empty because the custom domain serves from the root
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
collections:
  work:
    output: true
    permalink: /work/:name/
  projects:
    output: true
    permalink: /projects/:name/
defaults:
  - scope: { path: "", type: work }
    values: { layout: work }
  - scope: { path: "", type: projects }
    values: { layout: project }
markdown: kramdown
exclude:
  - docs/
  - CLAUDE.md
  - preview.sh
  - vendor/
  - Gemfile
  - Gemfile.lock
