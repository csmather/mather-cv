title: "Scott Mather — Portfolio"
description: "Oakland-based website administrator & developer."
url: "https://csmather.github.io"        # e.g., https://<username>.github.io
baseurl: "/mather-cv"    # set to "/<repo-name>" for project sites
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
collections:
  work:
    output: true
    permalink: /work/:name/
defaults:
  - scope: { path: "", type: work }
    values: { layout: work }
markdown: kramdown
